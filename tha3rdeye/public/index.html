<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE 3RD EYE · BIOS CHEATS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ===== গ্লোবাল স্টাইল ===== */
    :root{
      --bg-void:#050507;
      --bg-primary:#08080d;
      --bg-secondary:#0e0e16;
      --bg-card:rgba(16,16,26,0.62);
      --bg-card-solid:rgba(14,14,22,0.92);
      --hairline:rgba(255,255,255,0.06);
      --hairline-strong:rgba(255,255,255,0.1);
      --text-primary:#f3f3f8;
      --text-secondary:#9d9db4;
      --text-muted:#5f5f78;
      --red:#f2f2f5;
      --red-dim:#a9a9b2;
      --red-deep:#1c1c1f;
      --red-glow:rgba(255,255,255,0.4);
      --gold:#e6e6ec;
      --gold-dim:#b8b8c0;
      --emerald:#d6d6dc;
      --radius-lg:20px;
      --radius:14px;
      --radius-sm:10px;
      --ease:cubic-bezier(0.16,1,0.3,1);
      --ease-soft:cubic-bezier(0.4,0,0.2,1);
      --mono:'JetBrains Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Space Grotesk',sans-serif;
      background:var(--bg-primary);
      color:var(--text-primary);
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    body::before{
      content:'';
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        radial-gradient(ellipse 900px 600px at 12% 8%, rgba(255,255,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 700px 700px at 90% 15%, rgba(255,255,255,0.08) 0%, transparent 55%),
        radial-gradient(ellipse 900px 700px at 50% 105%, rgba(225,225,232,0.05) 0%, transparent 60%);
      animation: bgDrift 18s ease-in-out infinite alternate;
    }
    @keyframes bgDrift{0%{opacity:0.85;}100%{opacity:1;filter:hue-rotate(4deg);}}
    body::after{
      content:'';
      position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;
      background-image:linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:radial-gradient(ellipse 70% 60% at 50% 20%, black 20%, transparent 75%);
    }
    #particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.75;}
    #scanlineLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0.5;}
    #scanlineLayer::before{content:'';position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.05),transparent);animation:scanMove 7s linear infinite;}
    ::-webkit-scrollbar{width:8px;}
    ::-webkit-scrollbar-track{background:var(--bg-primary);}
    ::-webkit-scrollbar-thumb{background:linear-gradient(var(--red),var(--red-dim));border-radius:10px;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-10px) rotate(1.5deg);}}
    @keyframes pulseGlowRed{0%,100%{box-shadow:0 0 22px rgba(255,255,255,0.25),0 0 0 0 rgba(255,255,255,0.0);}50%{box-shadow:0 0 48px rgba(255,255,255,0.6),0 0 0 8px rgba(255,255,255,0.03);}}
    @keyframes irisSpin{0%{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(1.08);}100%{transform:rotate(360deg) scale(1);}}
    @keyframes drawBar{from{width:100%;}to{width:0%;}}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(0.95);}to{opacity:1;transform:translateX(0) scale(1);}}
    @keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    @keyframes borderTravel{0%{background-position:220% 0;}100%{background-position:-220% 0;}}
    @keyframes ringPulse{0%{transform:scale(0.8);opacity:0.9;}100%{transform:scale(1.7);opacity:0;}}
    @keyframes scanMove{0%{transform:translateY(-120px);}100%{transform:translateY(100vh);}}
    @keyframes rippleAnim{to{transform:scale(3.2);opacity:0;}}
    @keyframes blinkCursor{0%,100%{opacity:1;}50%{opacity:0;}}
    @keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(214,214,220,0.35);}50%{box-shadow:0 0 0 8px rgba(214,214,220,0);}}
    @keyframes slideOpen{from{opacity:0;transform:translateY(-8px);max-height:0;}to{opacity:1;transform:translateY(0);max-height:400px;}}

    .app-wrapper{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 24px 48px;min-height:100vh;display:flex;flex-direction:column;}
    .brand-header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 26px;border-bottom:1px solid var(--hairline);flex-wrap:wrap;gap:16px;position:relative;}
    .brand-header::after{content:'';position:absolute;bottom:-1px;left:0;width:120px;height:1px;background:linear-gradient(90deg,var(--red),transparent);}
    .brand{display:flex;align-items:center;gap:14px;text-decoration:none;}
    .brand-icon{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--red) 0%, var(--red-deep) 70%, #141416 100%);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;position:relative;flex-shrink:0;animation:pulseGlowRed 3.2s infinite;}
    .brand-icon::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);animation:irisSpin 10s linear infinite;}
    .brand-icon .eye{animation:irisSpin 14s linear infinite;display:inline-block;}
    .brand-icon .badge{position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:var(--gold);border-radius:50%;border:2px solid var(--bg-primary);box-shadow:0 0 12px rgba(225,225,232,0.6);animation:badgePulse 2.4s infinite;}
    .brand-text .main{font-family:'Orbitron',sans-serif;font-weight:900;font-size:21px;letter-spacing:2px;background:linear-gradient(120deg,#fff 20%,var(--red) 55%,#fff 80%);background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientMove 5s ease infinite;display:block;}
    .brand-text .sub{font-family:'Orbitron',sans-serif;font-weight:500;font-size:9.5px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;display:block;margin-top:2px;}
    .brand-text .sub span{color:var(--red);}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

    .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border:none;border-radius:var(--radius-sm);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:transform 0.25s var(--ease),box-shadow 0.25s var(--ease),background 0.25s var(--ease);text-decoration:none;background:transparent;color:var(--text-primary);border:1px solid var(--hairline-strong);isolation:isolate;}
    .btn:active{transform:scale(0.97);}
    .btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.45);transform:scale(0);animation:rippleAnim 0.6s ease-out forwards;pointer-events:none;z-index:0;}
    .btn-primary{background:linear-gradient(135deg,var(--red),var(--red-dim));color:#fff;border-color:transparent;box-shadow:0 4px 24px rgba(255,255,255,0.3);}
    .btn-primary:hover{box-shadow:0 8px 34px rgba(255,255,255,0.55);transform:translateY(-1px);}
    .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#101012;border-color:transparent;font-weight:700;box-shadow:0 4px 22px rgba(225,225,232,0.25);}
    .btn-gold:hover{box-shadow:0 8px 30px rgba(225,225,232,0.45);transform:translateY(-1px);}
    .btn-outline{background:rgba(255,255,255,0.02);}
    .btn-outline:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.18);}
    .btn-sm{padding:7px 16px;font-size:12.5px;}
    .btn-xs{padding:5px 12px;font-size:11px;border-radius:7px;}
    .btn-icon{padding:7px 10px;}
    .btn-danger{background:rgba(255,255,255,0.13);color:var(--red);border-color:rgba(255,255,255,0.22);}
    .btn-danger:hover{background:rgba(255,255,255,0.22);}
    .btn-success{background:rgba(214,214,220,0.13);color:var(--emerald);border-color:rgba(214,214,220,0.22);}
    .btn-block{width:100%;justify-content:center;}
    .btn[disabled]{opacity:0.6;cursor:not-allowed;transform:none !important;}

    .card{position:relative;background:var(--bg-card);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:30px 32px;backdrop-filter:blur(9px) saturate(120%);-webkit-backdrop-filter:blur(9px) saturate(120%);box-shadow:0 20px 60px -20px rgba(0,0,0,0.7);transition:border-color 0.35s var(--ease-soft),box-shadow 0.35s var(--ease-soft),transform 0.35s var(--ease-soft);overflow:hidden;}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent 60%,transparent);background-size:220% 100%;opacity:0.55;animation:borderTravel 4.5s linear infinite;}
    .card::after{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.05),transparent);transform:rotate(20deg);transition:left 1s var(--ease);pointer-events:none;}
    .card:hover::after{left:130%;}
    .card:hover{border-color:rgba(255,255,255,0.25);transform:translateY(-3px);box-shadow:0 26px 70px -18px rgba(0,0,0,0.75),0 0 44px -10px rgba(255,255,255,0.16);}
    .card-glow{border-color:rgba(255,255,255,0.2);box-shadow:0 0 50px -10px rgba(255,255,255,0.12),0 20px 60px -20px rgba(0,0,0,0.7);}
    .card-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.4px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
    .card-title .icon{color:var(--red);font-size:19px;filter:drop-shadow(0 0 8px rgba(255,255,255,0.5));}
    .card-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.5;}

    .hud-corner{position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,0.7);pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,255,255,0.6));z-index:2;}
    .hud-corner.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;}
    .hud-corner.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;}
    .hud-corner.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;}
    .hud-corner.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;}

    .form-group{margin-bottom:18px;}
    .form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;letter-spacing:0.4px;text-transform:uppercase;}
    .form-control{width:100%;padding:13px 16px;background:rgba(255,255,255,0.035);border:1px solid var(--hairline-strong);border-radius:var(--radius-sm);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;font-size:14px;transition:border-color 0.25s var(--ease-soft),box-shadow 0.25s var(--ease-soft),background 0.25s var(--ease-soft);outline:none;}
    .form-control:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,255,255,0.14);background:rgba(255,255,255,0.055);}
    .form-control::placeholder{color:var(--text-muted);font-size:13px;}
    .input-icon-group{position:relative;}
    .input-icon-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none;transition:color 0.25s;}
    .input-icon-group .form-control{padding-left:38px;}
    .input-icon-group .form-control:focus + i,.input-icon-group i.lit{color:var(--red);}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
    .stat-item{position:relative;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:18px 20px;text-align:center;overflow:hidden;transition:border-color 0.3s,transform 0.3s;}
    .stat-item:hover{border-color:rgba(255,255,255,0.28);transform:translateY(-2px);box-shadow:0 10px 30px -12px rgba(255,255,255,0.25);}
    .stat-item .label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-muted);font-weight:600;}
    .stat-item .value{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:700;margin-top:6px;color:#fff;word-break:break-all;}
    .stat-item .copy-mini{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.05);border:1px solid var(--hairline-strong);color:var(--text-muted);border-radius:6px;width:22px;height:22px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
    .stat-item .copy-mini:hover{color:var(--red);border-color:rgba(255,255,255,0.4);}

    .badge-status{display:inline-flex;align-items:center;gap:7px;padding:5px 16px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:0.5px;font-family:'Orbitron',sans-serif;}
    .badge-status.active{background:rgba(214,214,220,0.13);color:var(--emerald);border:1px solid rgba(214,214,220,0.25);animation:badgePulse 2.6s infinite;}
    .badge-status.inactive{background:rgba(255,255,255,0.12);color:var(--red);border:1px solid rgba(255,255,255,0.22);}
    .badge-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor;}

    .table-wrap{overflow-x:auto;margin-top:14px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    table th{text-align:left;padding:12px 14px;color:var(--text-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;border-bottom:1px solid var(--hairline);}
    table td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text-secondary);}
    table tr{transition:background 0.2s;}
    table tbody tr:hover{background:rgba(255,255,255,0.02);}
    table .key-cell{font-family:var(--mono);font-size:11.5px;color:var(--gold);letter-spacing:0.5px;}

    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:24px;flex-wrap:wrap;}
    .tab-btn{padding:11px 20px;background:transparent;border:none;color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;transition:color 0.25s,border-color 0.25s;}
    .tab-btn:hover{color:var(--text-primary);}
    .tab-btn.active{color:var(--red);border-bottom-color:var(--red);text-shadow:0 0 12px rgba(255,255,255,0.5);}
    .tab-pane{display:none;}
    .tab-pane.active{display:block;animation:fadeUp 0.4s var(--ease) both;}

    .toast-container{position:fixed;top:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:380px;width:calc(100% - 44px);}
    .toast{position:relative;padding:15px 20px;border-radius:var(--radius-sm);background:var(--bg-card-solid);border:1px solid var(--hairline-strong);backdrop-filter:blur(10px);box-shadow:0 14px 44px rgba(0,0,0,0.55);display:flex;align-items:center;gap:12px;animation:toastIn 0.4s var(--ease) both;font-size:13.5px;color:var(--text-primary);overflow:hidden;}
    .toast.success{border-color:rgba(214,214,220,0.3);}
    .toast.error{border-color:rgba(255,255,255,0.35);}
    .toast .toast-bar{position:absolute;bottom:0;left:0;height:2px;background:currentColor;opacity:0.4;animation:drawBar 4s linear forwards;}

    .auth-container{max-width:440px;margin:50px auto 40px;padding:0 16px;position:relative;z-index:2;}
    .auth-container .card{padding:42px 38px;}
    .auth-container .brand-center{text-align:center;margin-bottom:30px;}
    .auth-container .brand-center .brand-icon{margin:0 auto 16px;width:68px;height:68px;font-size:30px;}
    .auth-container .brand-center h2{font-family:'Orbitron',sans-serif;font-weight:800;font-size:23px;letter-spacing:1px;}
    .auth-container .form-footer{margin-top:20px;text-align:center;font-size:13.5px;color:var(--text-muted);}
    .auth-container .form-footer a{color:var(--red);text-decoration:none;font-weight:600;transition:filter 0.2s;}

    .section-title{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
    .section-title h2{font-family:'Orbitron',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.5px;}
    .section-title h2 .highlight{color:var(--red);}

    .lock-screen{max-width:560px;margin:20px auto 0;position:relative;z-index:2;}
    .lock-icon-wrap{position:relative;width:120px;height:120px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;}
    .lock-icon-wrap .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,0.4);}
    .lock-icon-wrap .ring.r1{inset:0;animation:ringPulse 2.6s ease-out infinite;}
    .lock-icon-wrap .ring.r2{inset:16px;animation:ringPulse 2.6s ease-out infinite 0.6s;}
    .lock-icon-wrap .ring.r3{inset:32px;animation:ringPulse 2.6s ease-out infinite 1.2s;}
    .lock-icon-wrap .core{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--red),var(--red-deep) 70%,#141416);display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 0 44px rgba(255,255,255,0.55);animation:floatSlow 4.5s ease-in-out infinite;position:relative;z-index:1;color:#fff;}

    .hud-steps{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:24px 0 8px;flex-wrap:wrap;}
    .hud-step{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:88px;opacity:0.4;transition:opacity 0.4s;}
    .hud-step.active,.hud-step.done{opacity:1;}
    .hud-step .dot-icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(255,255,255,0.03);transition:all 0.3s;}
    .hud-step.active .dot-icon{border-color:var(--red);color:var(--red);box-shadow:0 0 16px rgba(255,255,255,0.45);}
    .hud-step.done .dot-icon{background:linear-gradient(135deg,var(--red),var(--red-dim));border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(255,255,255,0.4);}
    .hud-step .label{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);text-align:center;}
    .hud-line{width:40px;height:1px;background:var(--hairline-strong);margin:17px 2px 0;transition:background 0.4s;}
    .hud-line.done{background:linear-gradient(90deg,var(--red),var(--red-dim));}

    .dash-hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;}
    .dash-hero-info{flex:1;min-width:200px;}
    .dash-hero-info .provider-name{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:800;letter-spacing:0.5px;margin-bottom:6px;}
    .dash-hero-info .username-line{font-size:13px;color:var(--text-muted);margin-bottom:14px;}
    .ring-wrap{position:relative;width:130px;height:130px;flex-shrink:0;}
    .ring-wrap svg{transform:rotate(-90deg);}
    .ring-bg{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:8;}
    .ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease);filter:drop-shadow(0 0 8px rgba(255,255,255,0.65));}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
    .ring-center .big{font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;color:#fff;}
    .ring-center .small{font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}

    .terminal-box{font-size:13px;color:var(--text-secondary);background:rgba(0,0,0,0.35);padding:14px 16px;border-radius:8px;font-family:var(--mono);word-break:break-all;line-height:1.7;border:1px solid var(--hairline);position:relative;}
    .terminal-box .cursor{display:inline-block;width:7px;height:14px;background:var(--red);margin-left:2px;vertical-align:middle;animation:blinkCursor 1s step-end infinite;}

    .collapse-panel{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.4s var(--ease-soft),opacity 0.3s ease;}
    .collapse-panel.open{max-height:400px;opacity:1;margin-top:14px;}

    .app-footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--hairline);text-align:center;font-size:11.5px;color:var(--text-muted);letter-spacing:0.3px;position:relative;z-index:1;}

    .page-enter{animation:fadeUp 0.5s var(--ease) both;}

    .mt-8{margin-top:8px;}
    .mt-24{margin-top:24px;}

    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.7s linear infinite;}

    @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}

    }
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;}
    }

    /* ============================================================
       ✨ PREMIUM 3D / ANIMATION UPGRADE LAYER ✨
       Eye logo, mouse parallax, click-sound ripple, glitch text,
       3D tilt cards & crazy 3D feature carousel.
       ============================================================ */

    /* ---- Animated professional eye logo ---- */
    .eye-logo-svg{width:100%;height:100%;overflow:visible;display:block;}
    .eye-logo-svg .eye-lid{transition:d 0.3s;}
    .eye-logo-svg .eye-scan-ring{transform-origin:50px 50px;animation:irisSpin 7s linear infinite;}
    .eye-logo-svg .eye-scan-ring2{transform-origin:50px 50px;animation:irisSpin 11s linear infinite reverse;opacity:0.5;}
    .eye-logo-svg .eye-iris{transform-origin:50px 50px;animation:irisPulseGlow 3.2s ease-in-out infinite;}
    .eye-logo-svg .eye-pupil{animation:pupilDart 6s ease-in-out infinite;}
    .eye-logo-svg .eye-highlight{animation:highlightBlink 3.2s ease-in-out infinite;}
    @keyframes irisPulseGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,0.65));}50%{filter:drop-shadow(0 0 11px rgba(255,255,255,1));}}
    @keyframes pupilDart{0%,100%{transform:translate(0,0);}18%{transform:translate(1.6px,-1.1px);}45%{transform:translate(-1.6px,1px);}72%{transform:translate(1px,1.2px);}}
    @keyframes highlightBlink{0%,92%,100%{opacity:0.9;}96%{opacity:0.2;}}

    /* ---- Cursor spotlight that follows mouse across the page ---- */
    #cursorGlow{position:fixed;top:0;left:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.04) 35%,transparent 70%);transition:opacity 0.4s;opacity:0;will-change:transform;}
    #cursorGlow.on{opacity:1;}
    #clickBurst{position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;z-index:9998;}

    /* ---- 3D tilt (mouse-reactive) cards ---- */
    .tilt-3d{transform-style:preserve-3d;transition:transform 0.12s ease-out,box-shadow 0.3s ease;will-change:transform;}
    .tilt-3d .tilt-layer{transform:translateZ(28px);transform-style:preserve-3d;}

    /* ---- Glitch / reveal text for headings ---- */
    .text-glitch{position:relative;display:inline-block;}
    .text-glitch::before,.text-glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;overflow:hidden;background:var(--bg-primary);}
    .text-glitch::before{left:2px;text-shadow:-2px 0 var(--red);animation:glitchTop 4.5s infinite linear alternate-reverse;clip-path:inset(0 0 55% 0);}
    .text-glitch::after{left:-2px;text-shadow:-2px 0 var(--gold),2px 2px var(--red);animation:glitchBottom 4.2s infinite linear alternate-reverse;clip-path:inset(55% 0 0 0);}
    @keyframes glitchTop{0%,92%,100%{transform:translate(0,0);opacity:0;}93%{transform:translate(-2px,-1px);opacity:0.7;}94%{transform:translate(2px,1px);opacity:0.7;}95%{opacity:0;}}
    @keyframes glitchBottom{0%,90%,100%{transform:translate(0,0);opacity:0;}91%{transform:translate(2px,1px);opacity:0.7;}92%{transform:translate(-2px,-1px);opacity:0.7;}93%{opacity:0;}}

    .type-cursor-line{display:inline-block;width:3px;height:0.9em;background:var(--red);margin-left:3px;vertical-align:middle;animation:blinkCursor 0.9s step-end infinite;box-shadow:0 0 8px var(--red);}

    /* ---- Crazy 3D feature carousel (auth screens) ---- */
    .carousel-3d-stage{position:relative;width:100%;height:190px;margin:26px auto 6px;perspective:1300px;}
    .carousel-3d-ring{position:absolute;inset:0;transform-style:preserve-3d;animation:carouselSpin 18s linear infinite;}
    .carousel-3d-ring:hover{animation-play-state:paused;}
    .carousel-3d-card{position:absolute;top:50%;left:50%;width:190px;height:110px;margin:-55px 0 0 -95px;background:linear-gradient(150deg,rgba(255,255,255,0.14),rgba(14,14,22,0.85));border:1px solid rgba(255,255,255,0.28);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(10px);box-shadow:0 0 30px -8px rgba(255,255,255,0.25) inset,0 14px 30px -10px rgba(0,0,0,0.6);}
    .carousel-3d-card i{font-size:22px;color:var(--red);filter:drop-shadow(0 0 8px rgba(255,255,255,0.6));}
    .carousel-3d-card span{font-size:11.5px;font-weight:700;letter-spacing:0.4px;color:var(--text-secondary);text-align:center;padding:0 10px;font-family:'Space Grotesk',sans-serif;}
    @keyframes carouselSpin{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}

    /* ---- SID cooldown chip ---- */
    .cooldown-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;font-size:11.5px;font-weight:700;background:rgba(225,225,232,0.12);color:var(--gold);border:1px solid rgba(225,225,232,0.28);font-family:var(--mono);letter-spacing:0.3px;}
    .cooldown-chip.ready{background:rgba(214,214,220,0.12);color:var(--emerald);border-color:rgba(214,214,220,0.28);}

    @media (max-width:600px){
      .carousel-3d-stage{height:150px;}
      .carousel-3d-card{width:150px;height:92px;margin:-46px 0 0 -75px;}
      #cursorGlow{display:none;}
    }
  </style>
</head>
<body>
<canvas id="particleCanvas"></canvas>

<svg width="0" height="0" style="position:absolute;overflow:hidden;">
  <defs>

    <path class="eye-lid" d="M4,50 Q50,8 96,50 Q50,92 4,50 Z" fill="none" stroke="url(#irisGrad)" stroke-width="3.2" stroke-linecap="round"/>
    <circle class="eye-scan-ring" cx="50" cy="50" r="29" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-dasharray="4 7"/>
    <circle class="eye-iris" cx="50" cy="50" r="21" fill="url(#irisGrad)"/>

      <div class="brand-icon tilt-3d"><svg class="eye-logo-svg"><use href="#eyeLogoSymbol"></use></svg><span class="badge"></span></div>
      <div class="brand-text"><span class="main">THE 3RD EYE</span><span class="sub">· <span>PREMIUM</span> ACCESS ·</span></div>
    </a>

  </header>

  <footer class="app-footer">
    <span>◆ THE 3RD EYE · BIOS CHEATS Authorization System <span class="text-red">v3.1</span></span>
    <span style="margin:0 8px;">·</span>
    <span>👁️ <span class="text-red">2026</span></span>

      <button class="btn btn-outline btn-xs" onclick="window._clearData()">🧹 Clear Data</button>
    </span>
  </footer>
</div>

<script>
(function(){
  'use strict';

  // ============ পার্টিকেল ব্যাকগ্রাউন্ড (ইন্টারঅ্যাক্টিভ + গ্লো) ============
  (function initParticles(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, particles = [], orbs = [];
    const mouse = { x: -9999, y: -9999 };
    let t = 0;

    // পারফরম্যান্স ফিক্স: পার্টিকেল সংখ্যা অনেক কমানো হয়েছে (আগে ৪৫-৯০টি ছিল)
    function count(){ return window.innerWidth < 700 ? 14 : 26; }

    function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    function makeParticles(){
      particles = Array.from({length: count()}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
        r: Math.random()*1.7+0.6, tw: Math.random()*Math.PI*2
      }));
      // পারফরম্যান্স ফিক্স: ব্যাকগ্রাউন্ড অর্ব ৬টি থেকে ৩টি করা হয়েছে
      orbs = Array.from({length: 3}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.12,
        r: Math.random()*3+2.4
      }));
    }
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', (e) => { if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } }, { passive:true });

    // পারফরম্যান্স ফিক্স: আগে প্রতি ফ্রেমে O(n²) লাইন-কানেকশন লুপ + প্রতিটি পার্টিকেলে
    // shadowBlur লাগানো হতো — এই দুটোই ভারী ছিল এবং সাইট ল্যাগ করার মূল কারণ ছিল।
    // এখন কোনো কানেকশন লাইন নেই, কোনো shadowBlur নেই, এবং FPS ~30 এ ক্যাপ করা আছে।
    let lastFrame = 0;
    function step(now){
      if (!reduceMotion) requestAnimationFrame(step);
      if (now - lastFrame < 33) return; // ~30fps cap
      lastFrame = now;
      t += 0.033;
      ctx.clearRect(0,0,w,h);

      for (const o of orbs){
        o.x += o.vx; o.y += o.vy;
        if (o.x < -50 || o.x > w+50) o.vx *= -1;
        if (o.y < -50 || o.y > h+50) o.vy *= -1;
        const grad = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*18);
        grad.addColorStop(0, 'rgba(255,255,255,0.12)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r*18, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (const p of particles){
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 120 && dist > 0.01){
          const force = (120 - dist) / 120;
          p.x += (dx/dist) * force * 1.8;
          p.y += (dy/dist) * force * 1.8;
        }
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        const alpha = 0.3 + 0.3 * Math.sin(t*1.4 + p.tw);
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    resize(); makeParticles();
    window.addEventListener('resize', () => { resize(); makeParticles(); });
    if (!reduceMotion) requestAnimationFrame(step);
  })();

  // ============ টোস্ট, API, স্টেট ============
  const STATE = { user: null, token: null, page: 'dashboard' };
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const pageContent = $('#pageContent');
  const headerActions = $('#headerActions');
  const toastContainer = $('#toastContainer');

  function showToast(message, type = 'info', duration = 4000) {
    const icons = { error: '✕', success: '✓', info: '◆' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type] || '◆'}</span><span>${message}</span><span class="toast-bar" style="animation-duration:${duration}ms;"></span>`;
    toastContainer.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(40px)';
      el.style.transition = '0.3s ease';
      setTimeout(() => el.remove(), 400);
    }, duration);
  }

  // বাটন রিপল ইফেক্ট + ক্লিক সাউন্ড (গ্লোবাল)
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn || btn.disabled) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 650);
    playClickSound();
  });

  // ============ সিন্থেসাইজড ক্লিক সাউন্ড (Web Audio API — কোনো বাইরের ফাইল লাগবে না) ============
  let _audioCtx = null;
  function getAudioCtx() {
    if (!_audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) _audioCtx = new Ctx();
    }
    return _audioCtx;
  }
  function playClickSound() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) { /* audio not available — fail silently */ }
  }
  // প্রথম ইউজার ইন্টারঅ্যাকশনে AudioContext আনলক (ব্রাউজার অটোপ্লে পলিসি)
  ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, () => getAudioCtx(), { once: true }));

  // ============ মাউস প্যারালাক্স / 3D টিল্ট + কার্সর গ্লো (গ্লোবাল) ============
  (function initMouseFX() {
    const glow = document.getElementById('cursorGlow');
    let rafId = null, targetX = window.innerWidth / 2, targetY = window.innerHeight / 2;
    let currentX = targetX, currentY = targetY;

    function loop() {
      currentX += (targetX - currentX) * 0.15;
      currentY += (targetY - currentY) * 0.15;
      if (glow) glow.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%,-50%)`;
      rafId = requestAnimationFrame(loop);
    }

    window.addEventListener('mousemove', (e) => {
      targetX = e.clientX; targetY = e.clientY;
      if (glow) glow.classList.add('on');

      const tiltEl = e.target.closest('.tilt-3d');
      document.querySelectorAll('.tilt-3d').forEach(el => {
        if (el !== tiltEl) return;
        const rect = el.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        const rx = (0.5 - py) * 16;
        const ry = (px - 0.5) * 16;
        el.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02,1.02,1.02)`;
      });
    });

    document.addEventListener('mouseleave', () => { if (glow) glow.classList.remove('on'); }, true);

    document.addEventListener('mouseout', (e) => {
      const el = e.target.closest && e.target.closest('.tilt-3d');
      if (el && !el.contains(e.relatedTarget)) {
        el.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
      }
    });

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      loop();
    }
  })();

  // ক্লিপবোর্ড কপি হেল্পার
  window._copyText = function(text, btnEl) {
    if (!navigator.clipboard) { showToast('Clipboard not supported.', 'error'); return; }
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied to clipboard!', 'success', 2000);
      if (btnEl) {
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => { btnEl.innerHTML = orig; }, 1100);
      }
    }).catch(() => showToast('Copy failed.', 'error'));
  };

  // 401 হ্যান্ডলিং সহ apiCall — বাগ ফিক্স: আগে সেশন এক্সপায়ার হলেও কিছু বলা হতো না
  async function apiCall(endpoint, method = 'GET', body = null, token = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    try {
      const res = await fetch(endpoint, opts);
      let data;
      try { data = await res.json(); } catch { data = { success:false, message:'Invalid server response.' }; }
      if (res.status === 401 && STATE.token) {
        setToken(null); setUser(null); STATE.user = null;
        showToast(data.message || 'Session expired. Please login again.', 'error');
        navigate('login');
      }
      if (!res.ok && data.success === undefined) data.success = false;
      return data;
    } catch (e) {
      console.error('API Error:', e);
      return { success: false, message: 'Network error. Please check your connection.' };
    }
  }

  function getToken() { return localStorage.getItem('redkey_token'); }
  function setToken(token) { if (token) { localStorage.setItem('redkey_token', token); STATE.token = token; } else { localStorage.removeItem('redkey_token'); STATE.token = null; } }
  function getUser() { try { const d = localStorage.getItem('redkey_user'); return d ? JSON.parse(d) : null; } catch { return null; } }
  function setUser(user) { if (user) { localStorage.setItem('redkey_user', JSON.stringify(user)); STATE.user = user; } else { localStorage.removeItem('redkey_user'); STATE.user = null; } }
  function isLoggedIn() { return !!getToken() && !!getUser(); }
  function getRole() { return (STATE.user && STATE.user.role) || 'guest'; }
  function isActive(user) { return !!user && user.premiumStatus === 'active'; }

  // লাইসেন্স মেয়াদ হিসাব (রিং + টেক্সট)
  function formatTimeLeft(expiresAt) {
    if (expiresAt === null || expiresAt === undefined) return { percent: 100, big: '∞', small: 'LIFETIME', expired: false };
    const diff = expiresAt - Date.now();
    if (diff <= 0) return { percent: 0, big: '0', small: 'EXPIRED', expired: true };
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const percent = Math.max(4, Math.min(100, (diff / (30*86400000)) * 100));
    return { percent, big: days > 0 ? String(days) : String(hours), small: days > 0 ? 'DAYS LEFT' : 'HOURS LEFT', expired: false };
  }

  function licenseRingSVG(info) {
    const r = 54, c = 2 * Math.PI * r;
    const offset = c - (info.percent / 100) * c;
    return `
      <svg width="130" height="130" viewBox="0 0 130 130">

        <button class="btn btn-primary btn-sm" onclick="window._navigate('register')">
          <i class="fas fa-user-plus"></i> <span>Register</span>
        </button>

            ${expiredMsg
              ? `Hi <span class="text-red" style="font-weight:600;">${user.username}</span> — your previous license has expired. Redeem a new key to reactivate.`

          <form id="redeemForm" onsubmit="return false;">
            <div class="form-group">
              <label>Premium Key</label>

          </form>
        </div>
      </div>
    `;

    function refreshSteps() {
      const key = $('#redeemKey').value.trim();
      const ip = $('#redeemIp').value.trim();
      const sid = $('#redeemSid').value.trim();
      const stepKey = $('#step-key'), stepIp = $('#step-ip'), stepSid = $('#step-sid');
      const line1 = $('#line-1'), line2 = $('#line-2');
      stepKey.classList.toggle('done', !!key);
      stepIp.classList.toggle('done', !!ip);
      stepSid.classList.toggle('done', !!sid);
      line1.classList.toggle('done', !!key);
      line2.classList.toggle('done', !!ip);
      [stepKey, stepIp, stepSid].forEach(s => { if (!s.classList.contains('done')) s.classList.remove('active'); });
      if (!key) stepKey.classList.add('active');
      else if (!ip) stepIp.classList.add('active');
      else if (!sid) stepSid.classList.add('active');
    }
    ['redeemKey','redeemIp','redeemSid'].forEach(id => $('#'+id).addEventListener('input', refreshSteps));
    refreshSteps();

    const getIp = async (targetId) => {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        const ip = data.ip;
        if (targetId) { const el = document.getElementById(targetId); if (el) { el.value = ip; el.dispatchEvent(new Event('input')); } showToast('IP detected: ' + ip, 'success'); }
        return ip;
      } catch { showToast('Could not detect IP. Please enter manually.', 'error'); return null; }
    };
    document.getElementById('getIpBtn')?.addEventListener('click', () => getIp('redeemIp'));
    if (!user.ip) getIp('redeemIp');

    document.getElementById('redeemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = $('#redeemKey').value.trim();
      const ip = $('#redeemIp').value.trim();
      const sid = $('#redeemSid').value.trim();
      if (!key || !ip || !sid) { showToast('Please fill in all fields.', 'error'); return; }
      const btn = $('#redeemBtn');

      try {
        const res = await apiCall('/api/client/redeem', 'POST', { key, ip, sid }, getToken());
        if (res.success) {
          showToast('✓ Key redeemed! Account activated.', 'success');
          setUser(res.user); STATE.user = res.user; navigate('dashboard');
        } else {
          showToast(res.message || 'Redeem failed. Check your key.', 'error');
        }
      } catch (err) { showToast('Error: ' + err.message, 'error'); }
      finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Redeem Key'; }
    });
  }

    const getIp = async (targetId) => {

        return ip;
      } catch { showToast('Could not detect IP. Please enter manually.', 'error'); return null; }
    };
    document.getElementById('getIpBtn2')?.addEventListener('click', () => getIp('updateIp'));

    // ============ SID 24h কুলডাউন — লাইভ কাউন্টডাউন ============
    if (window._sidCooldownInterval) clearInterval(window._sidCooldownInterval);
    function fmtCountdown(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }
    function refreshSidCooldownUI() {
      const chip = document.getElementById('sidCooldownChip');
      const sidBtn = document.getElementById('updateSidBtn');
      const sidInput = document.getElementById('updateSid');
      if (!chip || !sidBtn || !sidInput) { clearInterval(window._sidCooldownInterval); return; }
      const remaining = STATE.user.sidCooldownMs || 0;
      if (remaining > 0) {
        chip.innerHTML = `<span class="cooldown-chip"><i class="fas fa-clock"></i> ${fmtCountdown(remaining)}</span>`;
        sidBtn.disabled = true; sidInput.disabled = true;
        sidInput.placeholder = 'Locked — 1 change per 24h';
        STATE.user.sidCooldownMs = Math.max(0, remaining - 1000);
      } else {
        chip.innerHTML = `<span class="cooldown-chip ready"><i class="fas fa-check"></i> Ready</span>`;
        sidBtn.disabled = false; sidInput.disabled = false;
        sidInput.placeholder = 'Enter new SID';
        clearInterval(window._sidCooldownInterval);
      }
    }

        } else if (res.cooldown) {
          setUser(res.user); STATE.user = res.user;
          showToast(`⏳ SID can be changed once every 24h. Try again in ${fmtCountdown(res.sidCooldownMs)}.`, 'error');

      const res = await apiCall('/api/reseller/clients', 'GET', null, getToken());
      if (res.success && res.clients) {
        if (res.clients.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No clients yet.</td></tr>'; return; }
        tbody.innerHTML = res.clients.map(c => `
          <tr>
            <td>${c.username}</td>
            <td>${c.email || '—'}</td>
            <td>${c.premiumStatus === 'active' ? '● Active' : (c.premiumStatus === 'expired' ? '◐ Expired' : '○ Inactive')}</td>
            <td style="font-size:11px;font-family:var(--mono);">${c.sid || '—'}</td>
            <td>${c.active !== undefined ? (c.active ? '● Active' : '○ Banned') : '● Active'}</td>
            <td>
              <button class="btn btn-sm ${c.active ? 'btn-danger' : 'btn-success'}" onclick="window._resellerToggleClient('${c.username}')">${c.active ? 'Ban' : 'Unban'}</button>
              <button class="btn btn-sm btn-outline" onclick="window._resellerResetClientSid('${c.username}')">Reset SID</button>
              <button class="btn btn-sm btn-danger" onclick="window._resellerDeleteClient('${c.username}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Failed to load.</td></tr>';
    } catch { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Error loading.</td></tr>'; }
  }

  window._resellerToggleClient = async function(username) {
    try {
      const res = await apiCall('/api/reseller/toggle-client-active', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerResetClientSid = async function(username) {
    if (!confirm(`Reset SID for "${username}"? They will be able to bind a new device immediately.`)) return;
    try {
      const res = await apiCall('/api/reseller/reset-client-sid', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerDeleteClient = async function(username) {
    if (!confirm(`Delete client "${username}"? This cannot be undone.`)) return;
    try {
      const res = await apiCall('/api/reseller/delete-client', 'DELETE', { username }, getToken());
      if (res.success) { showToast('Client deleted.', 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerRefreshClients = loadResellerClients;

  // ============ লগআউট ও ন্যাভিগেশন ============
  window._logout = async function() {
    const token = getToken();
    if (token) { try { await apiCall('/api/auth/logout', 'POST', null, token); } catch {} }
    setToken(null); setUser(null); STATE.user = null; showToast('Logged out.', 'info'); navigate('login');
  };

  window._navigate = function(page) {
    if (page === 'login' || page === 'register') {
      if (isLoggedIn()) { showToast('You are already logged in.', 'info'); return; }
      navigate(page); return;
    }
    if (!isLoggedIn()) { showToast('Please login first.', 'error'); navigate('login'); return; }
    const role = getRole();
    if (page === 'admin' && role !== 'admin') { showToast('Admin access only.', 'error'); return; }
    if (page === 'reseller' && role !== 'reseller' && role !== 'admin') { showToast('Reseller access only.', 'error'); return; }
    navigate(page);
  };

  document.getElementById('brandLink').addEventListener('click', (e) => {
    e.preventDefault();
    if (!isLoggedIn()) { navigate('login'); return; }
    const role = getRole();
    navigate(role === 'admin' ? 'admin' : role === 'reseller' ? 'reseller' : 'dashboard');
  });

  // ============ ইনিশিয়ালাইজ ============
  function init() {
    const token = getToken();
    const user = getUser();
    if (token && user) {
      STATE.token = token; STATE.user = user;
      const role = user.role || 'client';
      if (role === 'admin') navigate('admin');
      else if (role === 'reseller') navigate('reseller');
      else navigate('dashboard');
    } else {
      navigate('login');
    }
  }

  init();
})();
</script>
</body>
</html>
